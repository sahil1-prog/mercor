name = "owe/population-pk-autoinduction-forecast"
artifacts = ["/app/submission"]

[metadata]
author_name = "OpenWorldEngineer"
difficulty = "hard"
category = "Scientific Computing and Domain Science"
subcategory = "Statistical modeling"
task_objective = ["Implement", "Optimize"]
artifact_type = ["Single script or program", "Mathematical or scientific model"]
tags = [
  "population-pharmacokinetics",
  "nonlinear-mixed-effects",
  "censored-likelihood",
  "below-lloq",
  "autoinduction",
  "steady-state-exposure",
  "map-estimation",
  "oral-one-compartment",
  "enzyme-turnover",
  "dose-titration",
]
expert_time_estimate_hours = 10.0
difficulty_explanation = "Clearance increases dynamically through drug-induced enzyme turnover, and roughly 70% of subjects escalate to twice their dose after sparse sampling ends. Informative post-dose troughs are largely below assay quantification limits, requiring a population PK model with censored likelihood to extrapolate across dose titration and drug washout."

# The graded reward is binary (the pipeline finale writes reward.txt from the suite's exit
# status): a submission scores 1 only when EVERY check passes, including the stated pass bar
# reward = clip(1 - raw/0.5, 0, 1) >= 0.50 on the held-out cohort at the default window and
# at each graded window (tests/.truth/heldout.py EXTRA_HORIZONS = 1.05 / 6.05 / 24.05 /
# 47.95 h).
# 1.0 witness: the reference in solution/ (solve.sh) passes all 24 checks in local Docker
# runs of both images; its continuous rewards are 0.783 (24 h) / 0.806 / 0.872 / 0.782 /
# 0.667 at the graded windows. A perfect continuous reward is not reachable (censored
# sparse data, assay noise), but the graded score is binary, so the witness scores 1.0.
# Measured floor: nop, the naive baseline (raw 1.768), a constant output and a
# dose-and-covariate regression shortcut (raw 0.514) all score 0. See README.md.
[metadata.scoring]
floor = 0.0
baseline = 0.0
reference = 1.0
ceiling = 1.0
regrade_tolerance = 0.0
oracle = 1.0

[agent]
# Named non-root account; created at uid 1000 in environment/Dockerfile and tests/Dockerfile.
user = "agent"
timeout_sec = 14400
# No web search or downloads while the agent works; everything it needs ships in the image.
network_mode = "no-network"

[verifier]
user = "root"
environment_mode = "separate"
network_mode = "no-network"
# The suite rebuilds the 150-subject held-out cohort with truth at five forecast windows
# (~5 s) and then runs the submission ~40 times: six full-cohort runs (2 at the default
# window, 4 at the graded windows) plus ~35 runs on 3- or 4-subject toy cohorts. Each
# full-cohort run is held to BUDGET_S = 180 s (the stated 120 s contract plus a host-load
# grace); worst case 6*180 = 1080 s of predictor time plus toys and setup needs ~2200 s
# with a 2x margin. The reference suite run measured 132 s in total. 3000 s (the 3600 s cap
# allows it) leaves headroom without a slow-but-legitimate submission timing out the
# verifier itself.
timeout_sec = 3000

[environment]
build_timeout_sec = 2400
cpus = 4
memory_mb = 8192
storage_mb = 20480
gpus = 0
network_mode = "no-network"
workdir = "/app"
